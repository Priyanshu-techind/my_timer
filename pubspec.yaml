name: my_timer
description: "A drift-free Flutter timer widget. Count up/down with pause/resume/reset/seek, format presets, background resync, and zero external dependencies."
version: 2.0.0
homepage: https://github.com/Priyanshu-techind/my_timer
repository: https://github.com/Priyanshu-techind/my_timer
issue_tracker: https://github.com/Priyanshu-techind/my_timer/issues

topics:
  - timer
  - countdown
  - stopwatch
  - widget
  - duration

screenshots:
  - description: 'Countdown timer with pause, resume, reset, and ±10s controls.'
    path: screenshots/countdown.png
  - description: 'Count-up stopwatch with millisecond precision.'
    path: screenshots/stopwatch.png
  - description: 'Custom builder showing a progress bar alongside the timer text.'
    path: screenshots/custom_builder.png
  - description: 'All six built-in format presets rendered side-by-side.'
    path: screenshots/formats.png

environment:
  sdk: ^3.6.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
